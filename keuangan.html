<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan RT 02</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mengunci Font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;&display=swap" rel="stylesheet">
    
    <style>
        /* Mengunci font dan membatasi bold maksimal 600 */
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 400;
        }
        b, strong, .font-bold { font-weight: 600 !important; }
        .font-semibold { font-weight: 600 !important; }
        .font-medium { font-weight: 500 !important; }

        /* Background */
        .main-bg {
            background-color: #E6E6E6;
            z-index: 1;
        }
        
        /* Card Solid (Tidak Transparan) */
        .bento-box {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* Scrolled Header State */
        #main-header {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: #1155CC; /* Warna Header */
            box-shadow: 0 4px 20px rgba(17, 85, 204, 0.3);
        }

        /* Input Pencarian, Filter & Sort Button */
        .search-input, .sort-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            transition: all 0.2s;
            color: #1f2937;
        }
        .search-input:focus, .sort-btn:focus {
            outline: none;
            border-color: #8B5CF6;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }
        .sort-btn:active {
            transform: scale(0.95);
            background-color: #f3f4f6;
        }

        /* Animasi Bulat Kedip-kedip */
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
        .dot-blink {
            width: 10px;
            height: 10px;
            background-color: #4ADE80;
            border-radius: 50%;
            animation: blink 1.5s infinite ease-in-out;
            display: inline-block;
        }

        /* Hover Keterangan Kode (Tooltip) */
        .kode-container { position: relative; cursor: pointer; display: inline-flex; align-items: center;}
        .kode-tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid #e2e8f0;
            color: #1f2937;
            padding: 8px 14px;
            border-radius: 6px;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .kode-container:hover .kode-tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* Batas Jelas Card per Transaksi */
        .row-item {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #d1d5db; 
            background-color: #ffffff;
            border-radius: 12px;
            margin-bottom: 12px; 
        }
        .row-item:last-child { margin-bottom: 0; }
        
        /* Hover Color */
        .row-item:hover {
            transform: scale(1.003);
            z-index: 10;
            position: relative;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            border-color: #8B5CF6; 
        }

        /* Bulatan Angka Diperbesar */
        .number-circle {
            width: 28px;
            height: 28px;
            background-color: #E5E7EB;
            color: #374151;
            border-radius: 20%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }
        
    </style>
</head>
<body class="main-bg min-h-screen p-2 md:p-6 relative overflow-x-hidden text-gray-800">
    
    <!-- Ornamen Latar Belakang -->
    <div class="fixed top-[-10%] left-[-5%] w-[40%] h-[40%] rounded-full bg-[#8B5CF6]/10 blur-3xl -z-10 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-[#1155CC]/10 blur-3xl -z-10 pointer-events-none"></div>

    <div class="max-w-6xl mx-auto space-y-4 relative">
        
        <!-- Header Utama (STICKY TOP) - Desain Compact di Mobile -->
        <div id="main-header" class="rounded-xl p-3 md:p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 sticky top-2 z-[60]">
            
            <!-- Judul & Tanggal (Sejajar di Mobile) -->
            <div class="flex justify-between w-full md:w-auto items-center md:items-start md:flex-col md:gap-0">
                <div>
                    <h1 class="text-[17px] md:text-[26px] font-bold text-white flex items-center gap-2">
    Pembukuan Kas RT 2
</h1>
                    <!-- Subtitle hanya muncul di Desktop -->
                    <div class="hidden md:block">
                        <p class="text-white/85 mt-1 text-[14px]">Pengelolaan ini terhitung sejak oktober 2025</p>
                        <div class="flex items-center gap-2 mt-2">
                            <div class="dot-blink"></div>
                            <span class="font-medium text-white tracking-wide text-[14px]">Data Tersinkronisasi</span>
                        </div>
                    </div>
                </div>
                <!-- Tanggal -->
                <div id="hari-tanggal" class="font-bold text-white/90 text-[12px] md:text-[16px]"></div>
            </div>
            
            <!-- Area Input & Tombol (Compact Grid di Mobile) -->
            <div class="w-full md:w-auto flex flex-col gap-2">
                
                <!-- Input Pencarian Teks (Full Width di Mobile) -->
                <div class="relative w-full md:w-80">
                    <input type="text" id="searchInput" class="search-input w-full px-3 py-2 pl-9 rounded-lg text-[14px] md:text-[15px] shadow-sm font-medium" placeholder="Pencarian data...">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                
                <!-- Filter Kode & Tombol Urutkan -->
                <div class="flex gap-2 w-full md:justify-end items-stretch">
                    <!-- Filter Kode -->
                    <select id="filterKode" class="search-input px-2 py-2 rounded-lg text-[13px] md:text-[15px] flex-1 md:flex-none md:w-40 cursor-pointer font-medium shadow-sm">
                        <option value="">Semua Kode</option>
                        <option value="1">1 - Jimpitan</option>
                        <option value="2">2 - Jasa Inv</option>
                        <option value="3">3 - Sosial</option>
                        <option value="4">4 - Pembangunan</option>
                        <option value="5">5 - Lain-lain</option>
                        <option value="6">6 - Kas Pemuda</option>
                    </select>
                    
                    <!-- Tombol Urutkan (Hanya Ikon) -->
                    <button id="sortBtn" title="Ubah urutan data" class="sort-btn px-3 flex-shrink-0 rounded-lg cursor-pointer shadow-sm flex items-center justify-center text-[#1155CC]">
                        <svg id="sortIcon" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- Tabel Container -->
        <div class="bento-box rounded-xl flex flex-col relative pb-3 mt-1">
            
            <!-- Table Header Desktop -->
            <div class="hidden md:flex flex-row items-center font-semibold text-white px-4 py-4 text-[14px] sticky top-[110px] z-[50] rounded-t-xl" style="background-color: #0c43a3; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                <div class="w-12 text-center">No.</div>
                <div class="w-40 pl-3">Tanggal</div>
                <div class="w-32 text-center">Kode</div>
                <div class="flex-1 px-4">Deskripsi</div>
                <div class="w-36 text-right">Masuk</div>
                <div class="w-36 text-right">Keluar</div>
                <div class="w-40 text-right pr-4">Saldo Kas</div>
            </div>
            
            <!-- Loading Status -->
            <div id="loadingStatus" class="p-8 text-center font-medium text-gray-600 text-[14px]">
                Mengambil data terbaru...
            </div>
            
            <!-- Table Body -->
            <div id="table-body" class="flex flex-col p-3 md:p-4 bg-gray-50/50 rounded-b-xl rounded-t-none">
                <!-- Baris tabel otomatis dari JS -->
            </div>
            
        </div>
    </div>

    <script>
        // Set Format Tanggal
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('hari-tanggal').innerText = new Date().toLocaleDateString('id-ID', dateOptions);

        // Keterangan & Warna Kode
        const kodeInfo = {
            1: "Jimpitan", 2: "Jasa Inventaris", 3: "Sosial",
            4: "Pembangunan", 5: "Lain-lain", 6: "Kas Pemuda"
        };
        const kodeColor = {
            1: "text-purple-700", 2: "text-green-700", 3: "text-blue-700",
            4: "text-orange-700", 5: "text-gray-700", 6: "text-red-700"
        };
        const kodeBgColor = {
            1: "bg-purple-100", 2: "bg-green-100", 3: "bg-blue-100",
            4: "bg-orange-100", 5: "bg-gray-200", 6: "bg-red-100"
        };

        let dataLaporanLengkap = []; // Data asli tanpa filter
        let isUrutDariAtas = true; // Status awal: Normal dari atas ke bawah

        function formatUang(value) {
            if (!value) return '-';
            return value.toString().replace(/Rp/g, 'Rp ').replace(/\s+/g, ' ').trim();
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = ''; 
            
            if (data.length === 0) {
                tbody.innerHTML = '<div class="p-8 text-center text-gray-500 font-medium text-[15px]">Data tidak ditemukan.</div>';
                return;
            }

            data.forEach((row) => {
                const no = row[0] || '';
                const tanggal = row[1] || '';
                const kode = row[2] || '';
                const deskripsi = row[3] || '';
                const masuk = row[4] ? formatUang(row[4]) : '-';
                const keluar = row[5] ? formatUang(row[5]) : '-';
                const saldo = row[6] ? formatUang(row[6]) : '-';
                
                const labelKode = kodeInfo[kode] || "Tidak Diketahui";
                const colorKode = kodeColor[kode] || "text-gray-800";
                const bgKode = kodeBgColor[kode] || "bg-gray-100";

                const html = `
                    <div class="row-item flex flex-col md:flex-row py-4 px-4 md:py-3 shadow-sm">
                        
                        <!-- ================= MOBILE VIEW ================= -->
                        <div class="md:hidden flex flex-col w-full gap-3">
                            <div class="flex items-center justify-between border-b border-gray-200 pb-3">
                                <div class="flex items-center gap-3">
                                    <div class="number-circle shadow-sm">${no}</div>
                                    <div class="text-gray-900 font-bold text-[15px]">${tanggal}</div>
                                </div>
                                <div class="kode-container font-bold ${colorKode} ${bgKode} px-3 py-1.5 rounded-md text-[13px]">
                                    Kode ${kode}
                                    <div class="kode-tooltip">${labelKode}</div>
                                </div>
                            </div>
                            
                            <div class="text-gray-800 font-medium text-[15px] leading-relaxed text-left">
                                ${deskripsi}
                            </div>
                            
                            <div class="flex flex-col gap-2 mt-2 bg-gray-50 p-3.5 rounded-lg border border-gray-100">
                                <div class="flex items-center text-left">
                                    <span class="font-semibold text-gray-500 w-20 text-[14px]">Masuk</span>
                                    <span class="text-[#069446] font-bold text-[15px]">: ${masuk}</span>
                                </div>
                                <div class="flex items-center text-left">
                                    <span class="font-semibold text-gray-500 w-20 text-[14px]">Keluar</span>
                                    <span class="text-[#EF4444] font-bold text-[15px]">: ${keluar}</span>
                                </div>
                                <div class="flex items-center text-left border-t border-gray-200 pt-2 mt-1">
                                    <span class="font-semibold text-gray-500 w-20 text-[14px]">Saldo</span>
                                    <span class="text-[#1155CC] font-bold text-[16px]">: ${saldo}</span>
                                </div>
                            </div>
                        </div>

                        <!-- ================= DESKTOP VIEW ================= -->
                        <div class="hidden md:flex flex-row items-center w-full text-[14px]">
                            <div class="w-12 flex justify-center">
                                <div class="number-circle shadow-sm">${no}</div>
                            </div>
                            <div class="w-40 pl-3 text-gray-800 font-medium pr-2">${tanggal}</div>
                            <div class="w-32 text-center">
                                <div class="kode-container font-bold ${colorKode} ${bgKode} px-3 py-1.5 rounded-md text-[13px]">
                                    Kode ${kode}
                                    <div class="kode-tooltip">${labelKode}</div>
                                </div>
                            </div>
                            <div class="flex-1 px-4 text-gray-800 font-medium text-[15px] leading-snug">${deskripsi}</div>
                            <div class="w-36 text-right font-bold text-[15px]" style="color: #069446;">${masuk}</div>
                            <div class="w-36 text-right font-bold text-[15px] text-[#EF4444]">${keluar}</div>
                            <div class="w-40 text-right pr-4 font-bold text-[15px] text-[#1155CC]">${saldo}</div>
                        </div>
                    </div>
                `;
                tbody.insertAdjacentHTML('beforeend', html);
            });
        }

        // Live Fetch Data
        const sheetId = '15fj2WWG7HyEEoujvxEI8OkAKFFuve7yYKDfxw08IK68';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=Sheet1&range=B9:H`;

        fetch(url)
            .then(response => response.text())
            .then(data => {
                const jsonStr = data.substring(47).slice(0, -2);
                const json = JSON.parse(jsonStr);
                
                dataLaporanLengkap = [];
                json.table.rows.forEach(row => {
                    if (row.c) {
                        const noAda = row.c[0] && row.c[0].v != null;
                        const tglAda = row.c[1] && row.c[1].v != null;
                        const kodeAda = row.c[2] && row.c[2].v != null;
                        const descAda = row.c[3] && row.c[3].v != null;
                        const saldoAda = row.c[6] && row.c[6].v != null;
                        
                        const masukAda = row.c[4] && row.c[4].v != null;
                        const keluarAda = row.c[5] && row.c[5].v != null;

                        if (noAda && tglAda && kodeAda && descAda && saldoAda && (masukAda || keluarAda)) {
                            dataLaporanLengkap.push([
                                row.c[0].v,                                     
                                row.c[1].f || row.c[1].v,                       
                                row.c[2].v,                                     
                                row.c[3].v,                                     
                                masukAda ? (row.c[4].f || row.c[4].v) : '',     
                                keluarAda ? (row.c[5].f || row.c[5].v) : '',    
                                row.c[6].f || row.c[6].v                        
                            ]);
                        }
                    }
                });
                
                document.getElementById('loadingStatus').style.display = 'none';
                applyFilters(); // Langsung render menggunakan logika filter
            })
            .catch(error => {
                console.error("Gagal menarik data:", error);
                document.getElementById('loadingStatus').innerHTML = `<span class="text-red-500">Gagal mengambil data dari Google Sheet.</span>`;
            });

        // Logika Filter & Sorting Terintegrasi
        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filterKode = document.getElementById('filterKode').value;
            
            // 1. Lakukan Filtering
            let filteredData = dataLaporanLengkap.filter(row => {
                const rowTextMatch = row.some(cell => String(cell).toLowerCase().includes(keyword));
                const kodeMatch = filterKode === "" || String(row[2]) === filterKode;
                return rowTextMatch && kodeMatch;
            });
            
            // 2. Lakukan Sorting berdasarkan status tombol
            if (!isUrutDariAtas) {
                filteredData.reverse(); // Dibalik jika statusnya "Dari Bawah"
            }
            
            renderTable(filteredData);
        }

        // Listener Filter
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('filterKode').addEventListener('change', applyFilters);

        // Listener Tombol Urutan (Tanpa Teks)
        document.getElementById('sortBtn').addEventListener('click', () => {
            isUrutDariAtas = !isUrutDariAtas; // Toggle status boolean
            
            const sortIcon = document.getElementById('sortIcon');
            
            if (isUrutDariAtas) {
                sortIcon.style.transform = "rotate(0deg)";
            } else {
                sortIcon.style.transform = "rotate(180deg)"; // Putar panah 180 derajat
            }
            
            applyFilters();
        });

        // Scroll Effect Pada Header Mobile
        window.addEventListener('scroll', () => {
            const header = document.getElementById('main-header');
            if (window.scrollY > 20) {
                header.classList.add('is-scrolled');
                header.classList.remove('top-2', 'p-3', 'md:p-5');
                header.classList.add('top-0', 'p-2', 'md:p-4');
                header.style.borderRadius = '0 0 12px 12px';
            } else {
                header.classList.remove('is-scrolled', 'top-0', 'p-2', 'md:p-4');
                header.classList.add('top-2', 'p-3', 'md:p-5');
                header.style.borderRadius = '0.75rem';
            }
        });

    </script>
</body>
</html>
