<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Data Warga Terpadu</title>
    <meta name="description" content="Aplikasi Data Warga Terpadu RT 2-RW 3, Pasekan Lor">
    
    <style>
        /* Reset margin dan padding bawaan browser */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scrollbar ganda (dari browser dan iframe) */
            background-color: #D6D6D6; /* Warna latar belakang cadangan */
        }

        /* Styling iframe agar mengisi penuh layar */
        .app-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading spinner cadangan jika iframe butuh waktu untuk dimuat */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1155CC;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="loader">Memuat Aplikasi...</div>

    <!-- Iframe ke Google Apps Script -->
    <iframe 
        class="app-iframe"
        src="https://script.google.com/macros/s/AKfycbwUzlSRkS1bqneQjOlGFLCrI1sdUucwaxOSN2kr7UOvv1l7dYsmQPQGJ8_kmtpY7HUlxA/exec" 
        title="Data Warga RT 2 Paslor"
        allowfullscreen>
    </iframe>

</body>
</html>
