        .inv-btn-close-lightbox { background: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.25); width: 50px; height: 50px; font-size: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; }
        .inv-btn-close-lightbox:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.92); }
        
        .loading-text { text-align: center; color: #64748b; padding: 40px; font-size: 14px; width: 100%; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
    </style>
    
    <!-- Script Identitas Navigasi Halaman -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const halamanAktifSaatIni = 'inventaris'; 
            const mapMenu = {
                'home': 'btn-home', 'warga': 'btn-warga', 'inventaris': 'btn-inventaris',
                'lapak': 'btn-lapak', 'pengurus': 'btn-pengurus', 'galeri': 'btn-galeri',
                'tatatertib': 'btn-tatatertib', 'ronda': 'btn-ronda'
            };
            if (mapMenu[halamanAktifSaatIni]) {
                const tombolAktif = document.querySelectorAll('.' + mapMenu[halamanAktifSaatIni]);
                tombolAktif.forEach(btn => btn.classList.add('menu-tertekan'));
            }
        });
    </script>
</head>
<body>

<div class="app-wrapper">

    <!-- 2. MAIN CONTENT BOARD -->
    <div class="main-content-board" id="main-content-board">
        
        <!-- HEADER ORANYE INVENTARIS -->
        <div class="title-card-panel">
            <div class="title-card-left">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                <span>Inventaris RT 2</span>
            </div>
        </div>

        <!-- KONTEN INVENTARIS LIST & PENCARIAN -->
        <div class="info-dashboard-container">
            <div class="header-info-row" style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;">
                <div class="info-left" style="font-size: 13px; font-weight: 500; color: #5C5C5C; line-height: 1.4;">
                    <div style="font-size: 10px; color: #5C5C5C; margin-bottom: 4px;">Pembaruan: Otomatis</div>
                    Total Macam Barang:<br><strong id="invTotalItems" style="color: #1155CC; font-weight: 500; font-size: 18px;">0 Macam</strong>
                </div>
                
                <div class="stats-right" style="display: flex; gap: 8px; align-items: center;">
                    <input type="text" id="invSearchInput" class="search-input" placeholder="Cari Barang..." onkeyup="filterInvList()">
                    <div class="view-controls">
                        <button class="btn-view active" id="btnListView" onclick="setView('list')" title="List View">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                        </button>
                        <button class="btn-view" id="btnGridView" onclick="setView('grid')" title="Grid View">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="list-container" id="invListBody">
                <div class="loading-text">
                    <svg class="spinner" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                    Memuat data inventaris...
                </div>
            </div>
        </div>

        <!-- MODAL DETAIL INVENTARIS -->
        <div class="inv-modal-overlay" id="invDetailModal">
            <div class="inv-modal-card">
                <div class="inv-modal-body">
                    <div class="inv-modal-img-container" id="invModalImgContainer"></div>
                    <div class="inv-modal-grid-2" id="invModalGridContainer"></div>
                </div>
            </div>
        </div>

        <!-- LIGHTBOX GAMBAR INVENTARIS -->
        <div class="inv-lightbox-overlay" id="invLightboxOverlay" onclick="closeInvLightbox()">
            <img id="invLightboxImg" src="" alt="Preview Gambar" onclick="event.stopPropagation();">
            <div class="inv-lightbox-exit-container">
                <button class="inv-btn-close-lightbox" onclick="closeInvLightbox()">&times;</button>
            </div>
        </div>

    </div> 
    <!-- ==================== END MAIN CONTENT BOARD ==================== -->

</div> 

<!-- ======================================================================
     START SCRIPT: KONTEN INVENTARIS JS
     ====================================================================== -->
<script>
    let isScrolling = false;
    window.addEventListener('scroll', () => {
        if (!isScrolling) {
            window.requestAnimationFrame(() => {
                const appHeaderWrapper = document.getElementById('appHeaderWrapper');
                if (appHeaderWrapper) {
                    if (window.scrollY > 15) appHeaderWrapper.classList.add('header-morphed');
                    else appHeaderWrapper.classList.remove('header-morphed');
                }
                isScrolling = false;
            });
            isScrolling = true;
        }
    }, { passive: true });

    /* ==========================================================
       SCRIPT KHUSUS KONTEN INVENTARIS
       ========================================================== */
    function setView(viewType) {
        const container = document.getElementById('invListBody');
        const btnList = document.getElementById('btnListView');
        const btnGrid = document.getElementById('btnGridView');
        
        if (viewType === 'grid') {
            container.classList.add('grid-view');
            btnGrid.classList.add('active');
            btnList.classList.remove('active');
        } else {
            container.classList.remove('grid-view');
            btnList.classList.add('active');
            btnGrid.classList.remove('active');
        }
    }

    const invSheetId = '1wGC0nEYmp5YsSCYdsheoX6og_n2UZeYIsUsXVL_UyfQ';
    const invCsvUrl = `https://docs.google.com/spreadsheets/d/${invSheetId}/gviz/tq?tqx=out:csv`;
    let inventoryData = [];

    async function fetchInventoryData() {
        try {
            const response = await fetch(invCsvUrl);
            if (!response.ok) throw new Error('Network response error');
            const csvText = await response.text();
            inventoryData = parseInvCSV(csvText);
            renderInvList(inventoryData);
        } catch (error) {
            document.getElementById('invListBody').innerHTML = '<div class="loading-text" style="color:#ef4444;">Gagal memuat data inventaris. Pastikan koneksi dan pengaturan Sheet benar.</div>';
        }
    }

    function parseInvCSV(text) {
        const lines = text.split('\n');
        const result = [];
        for(let i = 1; i < lines.length; i++) {
            if(!lines[i].trim()) continue;
            let currentLine = lines[i];
            let values = []; let inQuotes = false; let currentVal = '';
            for(let char of currentLine) {
                if(char === '"') inQuotes = !inQuotes;
                else if(char === ',' && !inQuotes) { values.push(currentVal.trim()); currentVal = ''; }
                else currentVal += char;
            }
            values.push(currentVal.trim());
            
            const clean = (val) => {
                if (!val) return '-';
                let str = val.replace(/^"|"$/g, '').trim();
                return str === '' ? '-' : str;
            };

            result.push({
                foto: clean(values[0]) !== '-' ? clean(values[0]) : '', 
                nama: clean(values[1]),          
                tanggalMasuk: clean(values[2]),  
                keterangan: clean(values[3]),    
                nilai: clean(values[4]),         
                jumlah: clean(values[5]),        
                kondisi: clean(values[6]),       
                lokasi: clean(values[7]),        
                status: clean(values[8]),        
                peminjam: clean(values[9])       
            });
        }
        return result;
    }

    function toTitleCase(str) {
        if(!str || str === '-') return str;
        return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
    }

    function getInvCardStarRating(kondisiStr) {
        let svgPath = "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z";
        if(!kondisiStr || kondisiStr === '-') {
            return `<div class="card-stars">` + 
                   `<svg class="svg-star" viewBox="0 0 24 24"><path d="${svgPath}"/></svg>`.repeat(5) + 
                   `</div>`;
        }
        
        let textClean = kondisiStr.toLowerCase().trim();
        let activeStars = 5; 
        if (textClean.includes('tidak') || textClean.includes('rusak') || textClean.includes('buruk')) activeStars = 1; 
        else if (textClean.includes('cukup') || textClean.includes('sedang') || textClean.includes('kurang')) activeStars = 3; 

        let starsHtml = '<div class="card-stars">';
        for (let i = 1; i <= 5; i++) { 
            starsHtml += `<svg class="svg-star ${i <= activeStars ? 'active' : ''}" viewBox="0 0 24 24"><path d="${svgPath}"/></svg>`;
        }
        return starsHtml + '</div>';
    }

    function renderInvList(data) {
        const container = document.getElementById('invListBody');
        container.innerHTML = '';
        let totalItems = data.length;

        if(data.length === 0) {
            container.innerHTML = '<div class="loading-text" style="color:#64748b;">Barang tidak ditemukan.</div>';
            document.getElementById('invTotalItems').innerText = `0 Macam`;
            return;
        }

        const svgPh = `<svg class="svg-img-ph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;

        data.forEach((item, index) => {
            let numStr = (index + 1).toString().padStart(2, '0') + '.';
            let thumbHtml = item.foto ? `<img src="${item.foto}" loading="lazy" alt="thumb">` : svgPh;
            let strJumlah = item.jumlah.replace(/[^0-9]/g, '');
            if(!strJumlah) strJumlah = item.jumlah;
            
            let itemKondisi = item.kondisi && item.kondisi !== '-' ? item.kondisi : 'Baik';
            let cardStars = getInvCardStarRating(itemKondisi);
            let titleCaseName = toTitleCase(item.nama);

            const row = document.createElement('div');
            row.className = 'list-item';
            let delay = (index < 15) ? (index * 0.08) : 0; 
            row.style.animationDelay = `${delay}s`;
            row.setAttribute('onclick', `openInvModal(${index})`);
            
            row.innerHTML = `
                <div class="list-thumb">${thumbHtml}</div>
                <div class="list-content-wrapper">
                    <div class="list-qty-badge">
                        <span class="qty-num">${strJumlah}</span>
                        <span class="qty-lbl">UNIT</span>
                    </div>
                    <div class="list-text">
                        <div class="list-num">${numStr}</div>
                        <div class="list-name">${titleCaseName}</div>
                        <div class="card-kondisi-wrapper">
                            ${cardStars}
                            <div class="card-kondisi-text">${itemKondisi}</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(row);
        });

        document.getElementById('invTotalItems').innerText = `${totalItems} Macam`;
    }

    function filterInvList() {
        const input = document.getElementById('invSearchInput').value.toLowerCase();
        const filtered = inventoryData.filter(item => item.nama.toLowerCase().includes(input));
        renderInvList(filtered);
    }

    function getInvStarRatingHtml(kondisiStr) {
        let svgPath = "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z";
        let textClean = kondisiStr.toLowerCase().trim();
        let activeStars = 5;
        if (textClean.includes('tidak') || textClean.includes('rusak') || textClean.includes('buruk')) activeStars = 1; 
        else if (textClean.includes('cukup') || textClean.includes('sedang') || textClean.includes('kurang')) activeStars = 3; 

        let starsHtml = '<div class="inv-rating-inline-container"><div class="inv-star-rating">';
        for (let i = 1; i <= 5; i++) { 
            starsHtml += `<svg class="svg-star ${i <= activeStars ? 'active' : ''}" viewBox="0 0 24 24"><path d="${svgPath}"/></svg>`;
        }
        return starsHtml + `</div><span class="inv-star-text-sub">${kondisiStr}</span></div>`;
    }

    function openInvModal(index) {
        const input = document.getElementById('invSearchInput').value.toLowerCase();
        const currentData = input ? inventoryData.filter(item => item.nama.toLowerCase().includes(input)) : inventoryData;
        const item = currentData[index];

        const imgContainer = document.getElementById('invModalImgContainer');
        const svgBigPh = `<svg class="svg-img-big" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;

        if(item.foto && (item.foto.startsWith('http://') || item.foto.startsWith('https://'))) {
            imgContainer.innerHTML = `<img src="${item.foto}" class="zoomable" onclick="openInvLightbox('${item.foto}')" alt="Foto Barang">`;
        } else {
            imgContainer.innerHTML = svgBigPh;
        }

        let kondisiText = item.kondisi && item.kondisi !== '-' ? item.kondisi : 'Baik';
        let starComponent = getInvStarRatingHtml(kondisiText);
        
        let strJumlahOnly = item.jumlah.replace(/[^0-9]/g, '');
        if(!strJumlahOnly) strJumlahOnly = item.jumlah;
        
        let titleCaseNameModal = toTitleCase(item.nama);

        document.getElementById('invModalGridContainer').innerHTML = `
            <div class="inv-grid-box inv-header-integration-box full-width">
                <div class="left-side">
                    <div class="title-large">${titleCaseNameModal}</div>
                </div>
                <div class="right-side-square">
                    <span class="qty-value">${strJumlahOnly}</span>
                    <span class="qty-unit-label">Unit</span>
                </div>
            </div>
            <div class="inv-grid-box">
                <label>Kondisi Barang</label>
                ${starComponent}
            </div>
            <div class="inv-grid-box">
                <label>Lokasi Simpan</label>
                <span>${item.lokasi}</span>
            </div>
            <div class="inv-grid-box full-width">
                <label>Keterangan Tambahan</label>
                <span style="font-weight: 400; color: var(--text-gray);">${item.keterangan !== '-' ? item.keterangan : '-'}</span>
            </div>
            <div class="inv-grid-box full-width inv-modal-footer-action">
                <button class="inv-btn-icon-close-modal" onclick="closeInvModal()" title="Tutup">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
        `;

        const modal = document.getElementById('invDetailModal');
        modal.style.display = 'flex';
        setTimeout(() => { modal.classList.add('show'); }, 10);
        document.body.style.overflow = 'hidden';
    }

    function closeInvModal() {
        const modal = document.getElementById('invDetailModal');
        modal.classList.remove('show');
        setTimeout(() => { modal.style.display = 'none'; }, 300);
        
        if (!document.getElementById('invLightboxOverlay').classList.contains('show')) {
            document.body.style.overflow = 'auto';
        }
    }

    function openInvLightbox(src) {
        document.getElementById('invLightboxImg').src = src;
        const lightbox = document.getElementById('invLightboxOverlay');
        lightbox.style.display = 'flex';
        setTimeout(() => { lightbox.classList.add('show'); }, 10);
    }

    function closeInvLightbox() {
        const lightbox = document.getElementById('invLightboxOverlay');
        lightbox.classList.remove('show');
        setTimeout(() => { lightbox.style.display = 'none'; document.getElementById('invLightboxImg').src = ''; }, 300);
    }

    window.addEventListener('click', function(event) {
        if (event.target === document.getElementById('invDetailModal')) closeInvModal();
    });

    document.addEventListener("DOMContentLoaded", () => {
        fetchInventoryData();
    });
</script>
</body>
</html>
